# Cloudflare Pages configuration for IT-WebPlay
# Deploy via: npx wrangler pages deploy . --project-name it-webplay

name = "it-webplay"
compatibility_date = "2024-09-01"

# Pages-specific settings
# Static assets are served from the project root (index.html, site/*, etc.)
# Functions are auto-detected from the functions/ directory

# Environment variables (set these in Cloudflare Dashboard → Pages → Settings → Environment Variables):
# SUPABASE_URL           - Your Supabase project URL (e.g. https://xxxx.supabase.co)
# SUPABASE_SERVICE_ROLE_KEY - Supabase service role key (NEVER expose to browser)
# ENCRYPTION_KEY         - 64-char hex string for AES-256-GCM credential encryption
#
# Generate ENCRYPTION_KEY with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
