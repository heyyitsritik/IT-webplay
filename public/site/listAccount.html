<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT WebPlay</title>
  <script src="./webBrowser.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0e14;
    --surface: #151820;
    --surface-2: #1c2030;
    --border: #2a2e3d;
    --text: #e2e4ea;
    --text-dim: #7a7f94;
    --accent: #d4a843;
    --accent-glow: rgba(212, 168, 67, 0.15);
    --play: #43b581;
    --play-hover: #3ca374;
    --danger: #e04848;
    --danger-hover: #c93c3c;
    --edit: #5b8dd9;
    --clone: #d4a843;
    --radius: 8px;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Nav ── */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
  }

  .nav-links { display: flex; gap: 4px; }

  .nav-links a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .nav-links a:hover { color: var(--text); background: var(--surface-2); }
  .nav-links a.active { color: var(--accent); background: var(--accent-glow); }

  /* ── Main ── */
  main {
    flex: 1;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 16px;
  }

  /* ── Version bar ── */
  .version-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .version-bar label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .version-bar input {
    flex: 1;
    max-width: 160px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    color: var(--text);
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .version-bar input:focus { border-color: var(--accent); }

  .version-bar button {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .version-bar button:hover { opacity: 0.85; }

  /* ── Header row ── */
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }

  .header-row h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  .header-row h1 span {
    color: var(--text-dim);
    font-weight: 400;
    font-size: 14px;
    margin-left: 6px;
  }

  #search-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 13px;
    color: var(--text);
    font-family: inherit;
    width: 200px;
    outline: none;
    transition: border-color 0.2s;
  }

  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--text-dim); }

  /* ── Account cards ── */
  .accounts-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .account-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color 0.2s, background 0.2s;
  }

  .account-row:hover {
    border-color: #3a3e50;
    background: var(--surface-2);
  }

  .account-index {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    min-width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    border-radius: 4px;
  }

  .account-info {
    flex: 1;
    min-width: 0;
  }

  .account-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .account-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  .account-actions {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
  }

  /* ── Buttons ── */
  .btn {
    border: none;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    padding: 5px 10px;
    transition: all 0.15s;
    font-family: inherit;
    white-space: nowrap;
  }

  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .btn-play {
    background: var(--play);
    color: #fff;
    padding: 5px 14px;
  }
  .btn-play:hover { background: var(--play-hover); }

  .btn-edit {
    background: transparent;
    color: var(--edit);
    border: 1px solid var(--edit);
  }
  .btn-edit:hover { background: rgba(91, 141, 217, 0.1); }

  .btn-clone {
    background: transparent;
    color: var(--clone);
    border: 1px solid var(--clone);
  }
  .btn-clone:hover { background: var(--accent-glow); }

  .btn-delete {
    background: transparent;
    color: var(--danger);
    border: 1px solid transparent;
    opacity: 0.5;
  }
  .btn-delete:hover { opacity: 1; border-color: var(--danger); background: rgba(224, 72, 72, 0.08); }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-dim);
  }

  .empty-state p {
    font-size: 14px;
    margin-bottom: 12px;
  }

  .empty-state a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }

  /* ── Table fallback (used by registeredUsers.js) ── */
  table { display: none; }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    main { padding: 14px 10px; }
    .header-row { flex-direction: column; align-items: flex-start; }
    #search-input { width: 100%; }
    .account-actions { flex-wrap: wrap; }
    .btn { font-size: 10px; padding: 4px 8px; }
    nav { padding: 10px 14px; }
    .logo { font-size: 13px; }
    .nav-links a { font-size: 12px; padding: 5px 10px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">IT WEBPLAY</div>
  <div class="nav-links">
    <a href="registerAccount.html">+ Add Account</a>
    <a href="listAccount.html" class="active">Accounts</a>
  </div>
</nav>

<main>
  <form id="user-form">
    <div class="version-bar">
      <label for="version">Game Version</label>
      <input type="text" id="version" name="version" placeholder="e.g. 3.10.2">
      <button type="submit">Set</button>
    </div>
  </form>

  <div class="header-row">
    <h1>Accounts <span id="account-count"></span></h1>
    <input type="text" id="search-input" placeholder="Search accounts...">
  </div>

  <div class="accounts-grid" id="accounts-grid"></div>

  <!-- Hidden table for registeredUsers.js compatibility -->
  <div style="display:none">
    <div class="table-responsive">
      <table class="table table-bordered">
        <tbody id="auths-list"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
// ── Modern account renderer (replaces table-based one) ──
let auths = JSON.parse(window.localStorage.getItem('auths')) || [];

function renderAccounts() {
  const grid = document.getElementById('accounts-grid');
  const countEl = document.getElementById('account-count');
  grid.innerHTML = '';

  countEl.textContent = auths.length ? `(${auths.length})` : '';

  if (auths.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <p>No accounts registered yet</p>
        <a href="registerAccount.html">+ Add your first account</a>
      </div>`;
    return;
  }

  auths.forEach((auth, index) => {
    const row = document.createElement('div');
    row.className = 'account-row';
    row.dataset.search = `${auth.displayName} ${auth.server} ${auth.zone || ''}`.toLowerCase();

    row.innerHTML = `
      <div class="account-index">${index + 1}</div>
      <div class="account-info">
        <div class="account-name">${escapeHtml(auth.displayName)}</div>
        <div class="account-meta">Server ${auth.server}${auth.zone ? ' · Zone ' + auth.zone : ''}</div>
      </div>
      <div class="account-actions">
        <button class="btn btn-play" data-action="play" data-index="${index}">Play</button>
        <button class="btn btn-edit" data-action="edit" data-index="${index}">Edit</button>
        <button class="btn btn-clone" data-action="clone" data-index="${index}">Clone</button>
        <button class="btn btn-delete" data-action="delete" data-index="${index}">Delete</button>
      </div>`;
    grid.appendChild(row);
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ── Event delegation for buttons ──
document.getElementById('accounts-grid').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const idx = parseInt(btn.dataset.index);
  const auth = auths[idx];

  switch (btn.dataset.action) {
    case 'play':
      webBrowser(auth.username, auth.password, auth.zone);
      break;
    case 'edit':
      window.open(`edit.html?userIndex=${idx}`, '_blank');
      break;
    case 'clone':
      const cloned = { ...auth, id: Date.now() };
      auths.splice(idx + 1, 0, cloned);
      window.localStorage.setItem('auths', JSON.stringify(auths));
      renderAccounts();
      break;
    case 'delete':
      auths.splice(idx, 1);
      window.localStorage.setItem('auths', JSON.stringify(auths));
      renderAccounts();
      break;
  }
});

// ── Search ──
document.getElementById('search-input').addEventListener('input', (e) => {
  const filter = e.target.value.toLowerCase();
  document.querySelectorAll('.account-row').forEach(row => {
    row.style.display = row.dataset.search.includes(filter) ? '' : 'none';
  });
});

// ── Game version ──
var gameVersion = localStorage.getItem('gameVersion');
if (gameVersion) {
  document.getElementById('version').value = gameVersion;
}

document.getElementById('user-form').addEventListener('submit', function(event) {
  event.preventDefault();
  var versionInput = document.getElementById('version');
  localStorage.setItem('gameVersion', versionInput.value);
  versionInput.value = '';
  window.location.href = 'listAccount.html';
});

// ── Init ──
renderAccounts();

// Listen for storage changes (edit page updates)
window.addEventListener('storage', () => {
  auths = JSON.parse(window.localStorage.getItem('auths')) || [];
  renderAccounts();
});
</script>

</body>
</html>
