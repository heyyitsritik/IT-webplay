<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT WebPlay — Edit Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0c0e14;
    --surface: #151820;
    --surface-2: #1c2030;
    --border: #2a2e3d;
    --text: #e2e4ea;
    --text-dim: #7a7f94;
    --accent: #d4a843;
    --accent-glow: rgba(212, 168, 67, 0.15);
    --radius: 8px;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Nav ── */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
  }

  .nav-links { display: flex; gap: 4px; }

  .nav-links a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .nav-links a:hover { color: var(--text); background: var(--surface-2); }
  .nav-links a.active { color: var(--accent); background: var(--accent-glow); }

  /* ── Form card ── */
  main {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    width: 100%;
    max-width: 400px;
  }

  .card h1 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: center;
  }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 5px;
  }

  .field input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input:focus {
    border-color: var(--accent);
  }

  /* ── Password group ── */
  .input-group {
    display: flex;
  }

  .input-group input {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
    flex: 1;
  }

  .toggle-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 6px 6px 0;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    padding: 0 12px;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s;
    white-space: nowrap;
  }

  .toggle-btn:hover {
    color: var(--text);
  }

  /* ── Zone pills ── */
  .zone-pills {
    display: flex;
    gap: 8px;
  }

  .zone-pills input[type="radio"] { display: none; }

  .zone-pills label {
    flex: 1;
    text-align: center;
    padding: 9px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.2s;
    text-transform: none;
    letter-spacing: 0;
    margin-bottom: 0;
  }

  .zone-pills input[type="radio"]:checked + label {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-glow);
  }

  .zone-pills label:hover {
    border-color: #3a3e50;
    color: var(--text);
  }

  /* ── Submit ── */
  .submit-btn {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.2s, transform 0.15s;
    font-family: inherit;
  }

  .submit-btn:hover {
    opacity: 0.88;
    transform: translateY(-1px);
  }

  .submit-btn:active { transform: translateY(0); }

  /* ── Error state ── */
  .error-msg {
    text-align: center;
    color: #e04848;
    padding: 20px 0;
    font-size: 14px;
  }

  @media (max-width: 600px) {
    main { padding: 20px 12px; }
    .card { padding: 22px 18px; }
    nav { padding: 10px 14px; }
    .logo { font-size: 13px; }
    .nav-links a { font-size: 12px; padding: 5px 10px; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">IT WEBPLAY</div>
  <div class="nav-links">
    <a href="registerAccount.html">+ Add Account</a>
    <a href="listAccount.html">Accounts</a>
  </div>
</nav>

<main>
  <div class="card">
    <h1>Edit Account</h1>
    <div id="editForm"></div>
  </div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  const userIndex = parseInt(params.get('userIndex'));
  let auths = JSON.parse(localStorage.getItem('auths'));

  if (!isNaN(userIndex) && auths && auths.length > userIndex) {
    const user = auths[userIndex];

    const form = document.createElement('form');
    form.innerHTML = `
      <div class="field">
        <label for="displayName">Account Name</label>
        <input type="text" id="displayName" name="displayName" value="${user.displayName}" required>
      </div>
      <div class="field">
        <label for="username">Email</label>
        <input type="text" id="username" name="username" value="${user.username}" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-group">
          <input type="password" id="password" name="password" value="${user.password}" required>
          <button class="toggle-btn" type="button" id="togglePassword">Show</button>
        </div>
      </div>
      <div class="field">
        <label>Zone</label>
        <div class="zone-pills">
          <input type="radio" name="zone" id="zone-e" value="E" ${user.zone === 'E' ? 'checked' : ''}>
          <label for="zone-e">East</label>
          <input type="radio" name="zone" id="zone-w" value="W" ${user.zone === 'W' ? 'checked' : ''}>
          <label for="zone-w">West</label>
        </div>
      </div>
      <div class="field">
        <label for="server">Server</label>
        <input type="number" id="server" name="server" value="${user.server}" required>
      </div>
      <button type="submit" class="submit-btn">Save Changes</button>
    `;

    document.getElementById('editForm').appendChild(form);

    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordField = document.getElementById('password');
      const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordField.setAttribute('type', type);
      this.textContent = type === 'password' ? 'Show' : 'Hide';
    });

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      auths[userIndex].displayName = document.getElementById('displayName').value;
      auths[userIndex].username = document.getElementById('username').value;
      auths[userIndex].password = document.getElementById('password').value;
      auths[userIndex].server = document.getElementById('server').value;
      auths[userIndex].zone = document.querySelector('input[name="zone"]:checked')?.value || user.zone;
      localStorage.setItem('auths', JSON.stringify(auths));
      alert('Information updated successfully!');
      window.close();
    });
  } else {
    document.getElementById('editForm').innerHTML = '<p class="error-msg">Invalid user index or data unavailable.</p>';
  }
</script>

</body>
</html>
